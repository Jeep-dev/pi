name: One-shot active session UI repair
on:
  push:
    branches:
      - fix/security-lifecycle-build
    paths:
      - ".github/workflows/one-shot-active-session-fix.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-lifecycle-build
          fetch-depth: 0
      - name: Apply active-session ownership repair
        run: python3 tools/apply_active_session_fix.py
      - name: Commit repaired sources
        run: |
          git rm app/src/main/java/com/piandroid/SessionOwnershipRepairProvider.kt
          git rm tools/apply_active_session_fix.py
          git config user.name "Jeep-dev"
          git config user.email "213277512+Jeep-dev@users.noreply.github.com"
          git add app tools
          git commit -m "Bind chat UI to the active Pi runtime"
          git push origin HEAD:fix/security-lifecycle-build
