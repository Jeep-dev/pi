name: Fix shared cwd resume v2

on:
  push:
    branches:
      - fix/security-lifecycle-build
    paths:
      - ".github/workflows/fix-shared-resume-cwd-v2.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-lifecycle-build
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Patch and validate same-cwd resume
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"anchor count for {path} is {count}, expected 1: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          bridge = "app/src/main/assets/pi-android-bridge.mjs"
          replace_once(bridge, 'const bridgeVersion = "2026-09-14.1";', 'const bridgeVersion = "2026-09-14.2";')
          replace_once(bridge, '  "tool-args-lossless-v1",\n];', '  "tool-args-lossless-v1",\n  "cwd-shared-resume-v1",\n];')

          discovery_old = (
              'function sessionDiscoveryDirectories() {\n'
              '  return [...new Set(\n'
              '    [sessionDirForRuntime(), sessionDirForCwd(cwd)]\n'
              '      .filter(Boolean)\n'
              '      .map(directory => path.resolve(directory)),\n'
              '  )];\n'
              '}\n'
          )
          discovery_new = discovery_old + (
              '\nasync function androidPrivateSessionDirectories() {\n'
              '  const root = path.join(termuxHome, ".pi", "android", "sessions");\n'
              '  let owners;\n'
              '  try {\n'
              '    owners = await readdir(root, { withFileTypes: true });\n'
              '  } catch (error) {\n'
              '    if (error?.code === "ENOENT") return [];\n'
              '    throw error;\n'
              '  }\n'
              '  return owners\n'
              '    .filter(owner => owner.isDirectory())\n'
              '    .map(owner => path.join(root, owner.name, "pi-sessions"));\n'
              '}\n'
          )
          replace_once(bridge, discovery_old, discovery_new)
          replace_once(bridge, '    let id = "";\n    let firstUser = "";', '    let id = "";\n    let sessionCwd = "";\n    let firstUser = "";')
          replace_once(bridge,
              '      if (!id && entry?.type === "session") id = String(entry.id || "");',
              '      if (entry?.type === "session") {\n        if (!id) id = String(entry.id || "");\n        if (!sessionCwd) sessionCwd = String(entry.cwd || "").trim();\n      }')
          replace_once(bridge, '      id,\n      title:', '      id,\n      cwd: sessionCwd,\n      title:')
          replace_once(bridge,
              'async function listSessions() {\n  const directories = sessionDiscoveryDirectories();\n  const seen = new Set();',
              'async function listSessions() {\n'
              '  const baseDirectories = sessionDiscoveryDirectories();\n'
              '  const directories = [...new Set([\n'
              '    ...baseDirectories,\n'
              '    ...(await androidPrivateSessionDirectories()),\n'
              '  ].filter(Boolean).map(directory => path.resolve(directory)))];\n'
              '  const trustedUnscopedDirectories = new Set(baseDirectories.map(directory => path.resolve(directory)));\n'
              '  const seen = new Set();')
          replace_once(bridge,
              '  files.sort((a, b) => b.modified - a.modified);\n'
              '  const summaries = [];\n'
              '  for (const item of files.slice(0, 80)) {\n'
              '    try { summaries.push(await summarizeSession(item.file, currentFile)); }\n'
              '    catch {}\n'
              '  }\n'
              '  return summaries;\n',
              '  files.sort((a, b) => b.modified - a.modified);\n'
              '  const targetCwd = path.resolve(cwd);\n'
              '  const summaries = [];\n'
              '  for (const item of files) {\n'
              '    try {\n'
              '      const summary = await summarizeSession(item.file, currentFile);\n'
              '      const sessionCwd = String(summary.cwd || "").trim();\n'
              '      const sourceDirectory = path.resolve(path.dirname(summary.path));\n'
              '      const sameCwd = sessionCwd\n'
              '        ? path.resolve(expandHome(sessionCwd)) === targetCwd\n'
              '        : trustedUnscopedDirectories.has(sourceDirectory);\n'
              '      if (!sameCwd) continue;\n'
              '      summaries.push(summary);\n'
              '      if (summaries.length >= 80) break;\n'
              '    } catch {}\n'
              '  }\n'
              '  return summaries;\n')

          kotlin = "app/src/main/java/com/piandroid/PiBridge.kt"
          replace_once(kotlin, '    private val expectedBridgeVersion = "2026-09-14.1"', '    private val expectedBridgeVersion = "2026-09-14.2"')
          replace_once(kotlin, '        "tool-args-lossless-v1"\n    )', '        "tool-args-lossless-v1",\n        "cwd-shared-resume-v1"\n    )')

          test = "tools/test_bridge_auth.mjs"
          replace_once(test, '  assert.equal(health.bridgeVersion, "2026-09-14.1");', '  assert.equal(health.bridgeVersion, "2026-09-14.2");')
          replace_once(test, '  assert.ok(health.capabilities.includes("tool-args-lossless-v1"));', '  assert.ok(health.capabilities.includes("tool-args-lossless-v1"));\n  assert.ok(health.capabilities.includes("cwd-shared-resume-v1"));')
          replace_once(test,
              '  await symlink("/etc/passwd", path.join(sessionDirectory, "leak.jsonl"));\n'
              '  const listedSessions = await fetch(`http://127.0.0.1:${port}/sessions`, {\n',
              '  await symlink("/etc/passwd", path.join(sessionDirectory, "leak.jsonl"));\n'
              '  const siblingDirectory = path.join(home, ".pi", "android", "sessions", "sibling-android", "pi-sessions");\n'
              '  await mkdir(siblingDirectory, { recursive: true });\n'
              '  await writeFile(path.join(siblingDirectory, "same-cwd.jsonl"), [\n'
              '    JSON.stringify({ type: "session", version: 3, id: "same-cwd", cwd: home }),\n'
              '    JSON.stringify({ type: "message", id: "same-user", parentId: null, message: { role: "user", content: [{ type: "text", text: "shared sibling conversation" }] } }),\n'
              '  ].join("\\n") + "\\n");\n'
              '  await writeFile(path.join(siblingDirectory, "other-cwd.jsonl"), [\n'
              '    JSON.stringify({ type: "session", version: 3, id: "other-cwd", cwd: path.join(home, "other-project") }),\n'
              '    JSON.stringify({ type: "message", id: "other-user", parentId: null, message: { role: "user", content: [{ type: "text", text: "must stay in another cwd" }] } }),\n'
              '  ].join("\\n") + "\\n");\n'
              '  const listedSessions = await fetch(`http://127.0.0.1:${port}/sessions`, {\n')
          anchor = (
              '  assert.ok(\n'
              '    !listedSessions.sessions.some(session => session.path.endsWith("leak.jsonl")),\n'
              '    "session discovery must not follow symlinks outside the session directory",\n'
              '  );\n'
          )
          replace_once(test, anchor, anchor + (
              '  assert.ok(\n'
              '    listedSessions.sessions.some(session => session.id === "same-cwd" && session.title === "shared sibling conversation"),\n'
              '    "sessions from another Android Session with the same cwd must appear in /resume",\n'
              '  );\n'
              '  assert.ok(\n'
              '    !listedSessions.sessions.some(session => session.id === "other-cwd"),\n'
              '    "sessions from a different cwd must stay out of /resume",\n'
              '  );\n'
          ))

          gradle = "app/build.gradle.kts"
          replace_once(gradle, '// v5.19.23 build 123: preserve complete tool arguments for live and restored tool cards.', '// v5.19.24 build 124: share /resume discovery across Android Sessions with the same cwd.')
          replace_once(gradle, '        versionCode = 123', '        versionCode = 124')
          replace_once(gradle, '        versionName = "5.19.23"', '        versionName = "5.19.24"')
          PY
          node --check app/src/main/assets/pi-android-bridge.mjs
          node tools/test_bridge_auth.mjs
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/pi-android-bridge.mjs app/src/main/java/com/piandroid/PiBridge.kt tools/test_bridge_auth.mjs app/build.gradle.kts
          git commit -m "Share resume history across matching working directories"
          git push origin HEAD:fix/security-lifecycle-build
