name: One-shot gesture and default model fix
on:
  push:
    branches:
      - fix/security-lifecycle-build
    paths:
      - .github/workflows/one-shot-gesture-model-default-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-lifecycle-build
          fetch-depth: 0
      - name: Apply source repair
        run: python3 tools/apply_gesture_model_fix.py
      - name: Commit source repair
        run: |
          git config user.name Jeep-dev
          git config user.email 213277512+Jeep-dev@users.noreply.github.com
          git add app/src/main/java/com/piandroid/MainActivity.kt app/src/main/java/com/piandroid/PiSessionRuntime.kt app/build.gradle.kts
          git commit -m "Fix session swipe edge and global default model"
          git push origin HEAD:fix/security-lifecycle-build
