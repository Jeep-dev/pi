name: Repair centered tool footer

on:
  workflow_dispatch:
  push:
    branches:
      - fix/security-lifecycle-build
    paths:
      - "tools/repair_v51916.py"
      - ".github/workflows/repair-v51916.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-lifecycle-build
      - name: Apply repair
        run: python tools/repair_v51916.py
      - name: Verify patch
        run: |
          git diff --check
          grep -q 'val collapseInfo = when' app/src/main/java/com/piandroid/MainActivity.kt
          grep -q 'contentAlignment = Alignment.CenterStart' app/src/main/java/com/piandroid/MainActivity.kt
          grep -q 'contentAlignment = Alignment.CenterEnd' app/src/main/java/com/piandroid/MainActivity.kt
          node tools/test_active_session_ui.mjs
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/piandroid/MainActivity.kt tools/test_active_session_ui.mjs
          git commit -m "Center tool expand action and show hidden line count"
          git push origin HEAD:fix/security-lifecycle-build
