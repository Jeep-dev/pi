name: Restore persisted Session windows

on:
  push:
    branches:
      - fix/security-lifecycle-build
    paths:
      - ".github/workflows/restore-open-session-windows.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-lifecycle-build
      - name: Apply and validate repair
        shell: bash
        run: |
          python tools/patch_restore_open_sessions.py
          git diff --check
          grep -q 'runtime(record).ensureConnected(record, autoStart = true)' app/src/main/java/com/piandroid/PiSessionRuntime.kt
          grep -q 'versionName = "5.19.26"' app/build.gradle.kts
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/piandroid/PiSessionRuntime.kt app/build.gradle.kts
          git commit -m "Restore persisted Session windows after App restart"
          git push origin HEAD:fix/security-lifecycle-build
