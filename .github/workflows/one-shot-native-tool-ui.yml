name: One-shot native tool UI repair
on:
  push:
    branches: [fix/security-lifecycle-build]
    paths:
      - ".github/workflows/one-shot-native-tool-ui.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-lifecycle-build
          fetch-depth: 0
      - name: Apply native-style tool UI repair
        run: python3 tools/apply_native_tool_ui.py
      - name: Commit source repair
        run: |
          git config user.name "Jeep-dev"
          git config user.email "213277512+Jeep-dev@users.noreply.github.com"
          git add app/src/main/java/com/piandroid/MainActivity.kt app/src/main/java/com/piandroid/PiBridge.kt app/src/main/java/com/piandroid/PiTheme.kt app/src/main/java/com/piandroid/ToolPresentation.kt app/build.gradle.kts
          git commit -m "Match Android tool cards to native Pi"
          git push origin HEAD:fix/security-lifecycle-build
