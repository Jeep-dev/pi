name: Fix conversation file identity

on:
  push:
    branches:
      - fix/security-lifecycle-build
    paths:
      - ".github/workflows/fix-closed-session-resume.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-lifecycle-build
      - name: Patch file-first conversation identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('app/src/main/java/com/piandroid/PiSessionRuntime.kt')
          r = runtime.read_text()
          old = '''internal fun runtimeConversationMatches(record: PiSessionRecord, state: PiState): Boolean {
    val expectedFile = record.sessionFile
    return if (expectedFile.isNotBlank()) {
        samePiConversationFile(expectedFile, state.sessionFile) &&
            (record.piConversationId.isBlank() || record.piConversationId == state.piConversationId)
    } else {
        isPrivatePiSessionFile(record.androidSessionId, state.sessionFile) &&
            state.piConversationId == record.piConversationId.ifBlank { record.androidSessionId }
    }
}
'''
          new = '''internal fun runtimeConversationMatches(record: PiSessionRecord, state: PiState): Boolean {
    val expectedFile = record.sessionFile
    return if (expectedFile.isNotBlank()) {
        // Once a durable JSONL exists, the canonical conversation identity is the
        // file itself. Pi may expose a different/regenerated RPC sessionId after
        // process restart; rejecting the same file on that ID loses valid history.
        samePiConversationFile(expectedFile, state.sessionFile)
    } else {
        isPrivatePiSessionFile(record.androidSessionId, state.sessionFile) &&
            state.piConversationId == record.piConversationId.ifBlank { record.androidSessionId }
    }
}
'''
          if r.count(old) != 1:
              raise SystemExit(f'runtimeConversationMatches anchor count={r.count(old)}')
          runtime.write_text(r.replace(old, new, 1))

          test = Path('app/src/test/java/com/piandroid/SessionRegistryPolicyTest.kt')
          t = test.read_text()
          old_test = '''    @Test
    fun runtimeAttachRequiresOwnerAndConversationNotOnlyCwd() {
        val record = PiSessionRecord(
            "android-B", "B", "/same", "pi", 17651, "token-b",
            sessionFile = "/private/B.jsonl", piConversationId = "conversation-B"
        )
        val matching = PiState("p", "m", "M", "off", false, false, "/private/B.jsonl", "conversation-B", "B", 1, true)
        val wrongConversation = matching.copy(sessionFile = "/legacy/shared.jsonl", piConversationId = "conversation-A")
        assertTrue(runtimeConversationMatches(record, matching))
        assertFalse(runtimeConversationMatches(record, wrongConversation))
    }
'''
          new_test = '''    @Test
    fun runtimeAttachUsesPersistedSessionFileAsCanonicalConversationIdentity() {
        val record = PiSessionRecord(
            "android-B", "B", "/same", "pi", 17651, "token-b",
            sessionFile = "/private/B.jsonl", piConversationId = "conversation-B"
        )
        val matching = PiState("p", "m", "M", "off", false, false, "/private/B.jsonl", "conversation-B", "B", 1, true)
        val sameFileNewRpcId = matching.copy(piConversationId = "rpc-generated-after-restart")
        val wrongFile = matching.copy(sessionFile = "/legacy/shared.jsonl", piConversationId = "conversation-B")
        assertTrue(runtimeConversationMatches(record, matching))
        assertTrue(runtimeConversationMatches(record, sameFileNewRpcId))
        assertFalse(runtimeConversationMatches(record, wrongFile))
    }
'''
          if t.count(old_test) != 1:
              raise SystemExit(f'identity regression test anchor count={t.count(old_test)}')
          test.write_text(t.replace(old_test, new_test, 1))

          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text()
          g = g.replace('// v5.19.27 build 127: allow same-cwd /resume from histories left by closed Session windows.',
                        '// v5.19.28 build 128: restore persisted JSONL by file identity even if Pi RPC sessionId changes.', 1)
          g = g.replace('        versionCode = 127', '        versionCode = 128', 1)
          g = g.replace('        versionName = "5.19.27"', '        versionName = "5.19.28"', 1)
          if 'versionCode = 128' not in g or 'versionName = "5.19.28"' not in g:
              raise SystemExit('version bump failed')
          gradle.write_text(g)

          workflow = Path('.github/workflows/android.yml')
          w = workflow.read_text()
          w = w.replace('# v5.19.27 closed Session resume validation', '# v5.19.28 conversation file identity validation', 1)
          w = w.replace('name: pi-android-v5.19.27-apks', 'name: pi-android-v5.19.28-apks', 1)
          if 'pi-android-v5.19.28-apks' not in w:
              raise SystemExit('artifact version update failed')
          workflow.write_text(w)
          PY
          git diff --check
          grep -q 'samePiConversationFile(expectedFile, state.sessionFile)' app/src/main/java/com/piandroid/PiSessionRuntime.kt
          grep -q 'sameFileNewRpcId' app/src/test/java/com/piandroid/SessionRegistryPolicyTest.kt
          grep -q 'versionName = "5.19.28"' app/build.gradle.kts
          grep -q 'pi-android-v5.19.28-apks' .github/workflows/android.yml
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/piandroid/PiSessionRuntime.kt app/src/test/java/com/piandroid/SessionRegistryPolicyTest.kt app/build.gradle.kts .github/workflows/android.yml
          git commit -m "Use session file as canonical recovery identity"
          git push origin HEAD:fix/security-lifecycle-build
