name: Apply native Pi tool rendering repair

on:
  push:
    branches:
      - fix/security-lifecycle-build
    paths:
      - ".github/workflows/native-tool-render-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-lifecycle-build
      - name: Match native Pi tool presentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          main = Path('app/src/main/java/com/piandroid/MainActivity.kt')
          bridge_kt = Path('app/src/main/java/com/piandroid/PiBridge.kt')
          bridge_js = Path('app/src/main/assets/pi-android-bridge.mjs')
          build = Path('app/build.gradle.kts')
          test = Path('tools/test_active_session_ui.mjs')

          text = main.read_text()
          text, n = re.subn(
              r'''private fun toolDraftPreview\(raw: String, count: Int\): String \{.*?\n\}\n\nprivate fun markdownText''',
              '''private fun toolDraftPreview(raw: String, count: Int): String {\n    val content = partialJsonString(raw, "content")\n    return when {\n        content != null -> content\n        raw.isNotBlank() -> raw\n        count > 0 -> "…"\n        else -> ""\n    }\n}\n\nprivate fun markdownText''',
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'toolDraftPreview replacement count={n}')

          old = '''                            Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {\n                                Text(if (name == "bash") "$ bash" else name, color = colors.toolTitle, fontFamily = FontFamily.Monospace, fontSize = 12.sp, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f))\n                                if (line.toolIsError) Text("error", color = Danger, fontFamily = FontFamily.Monospace, fontSize = 9.5.sp)\n                            }\n                            if (renderedArgs.isNotBlank()) {\n                                Text(renderedArgs, color = if (name == "bash") colors.toolTitle else colors.markdownCyan, fontFamily = FontFamily.Monospace, fontSize = 12.sp, lineHeight = 18.sp, maxLines = if (line.collapsed) 3 else Int.MAX_VALUE, overflow = TextOverflow.Ellipsis, modifier = Modifier.fillMaxWidth().padding(top = 2.dp))\n                            }\n'''
          new = '''                            val callHeader = buildAnnotatedString {\n                                if (name == "bash") {\n                                    pushStyle(SpanStyle(color = colors.toolTitle, fontWeight = FontWeight.Bold))\n                                    append("$")\n                                    if (renderedArgs.isNotBlank()) { append(" "); append(renderedArgs) }\n                                    pop()\n                                } else {\n                                    pushStyle(SpanStyle(color = colors.toolTitle, fontWeight = FontWeight.Bold))\n                                    append(name)\n                                    pop()\n                                    if (renderedArgs.isNotBlank()) {\n                                        append(" ")\n                                        pushStyle(SpanStyle(color = colors.markdownCyan))\n                                        append(renderedArgs)\n                                        pop()\n                                    }\n                                }\n                            }\n                            Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {\n                                Text(callHeader, fontFamily = FontFamily.Monospace, fontSize = 12.sp, lineHeight = 18.sp, maxLines = if (line.collapsed) 3 else Int.MAX_VALUE, overflow = TextOverflow.Ellipsis, modifier = Modifier.weight(1f))\n                                if (line.toolIsError) Text("error", color = Danger, fontFamily = FontFamily.Monospace, fontSize = 9.5.sp)\n                            }\n'''
          if text.count(old) != 1:
              raise SystemExit(f'tool header anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          if 'Pi Android v5.19.21' in text:
              text = text.replace('Pi Android v5.19.21', 'Pi Android v5.19.22', 1)
          main.write_text(text)

          text = bridge_kt.read_text()
          pattern = r'''    private fun toolArgsText\(toolName: String, args: JSONObject\?\): String \{.*?\n    \}\n\n    private fun compactToolNumber'''
          replacement = '''    private fun toolArgsText(toolName: String, args: JSONObject?): String {\n        if (args == null || args.length() == 0) return ""\n        fun path(): String = args.optString("file_path").ifBlank { args.optString("path") }\n        return when (toolName) {\n            "bash" -> buildString {\n                append(args.optString("command"))\n                val timeout = args.optInt("timeout", 0)\n                if (timeout > 0) append(" (timeout ${timeout}s)")\n            }\n            "read" -> buildString {\n                append(path())\n                val offset = args.optInt("offset", 0)\n                val limit = args.optInt("limit", 0)\n                if (offset > 0 || limit > 0) append(" [${if (offset > 0) "offset $offset" else ""}${if (offset > 0 && limit > 0) ", " else ""}${if (limit > 0) "limit $limit" else ""}]")\n            }\n            "write", "edit" -> path()\n            "grep" -> buildString {\n                append('/').append(args.optString("pattern")).append('/')\n                path().takeIf { it.isNotBlank() }?.let { append(" in ").append(it) }\n            }\n            "find" -> buildString {\n                append(args.optString("pattern", args.optString("query")))\n                path().takeIf { it.isNotBlank() }?.let { append(" in ").append(it) }\n            }\n            "ls" -> path().ifBlank { "." }\n            "subagent" -> {\n                val tasks = args.optJSONArray("tasks")\n                if (tasks != null && tasks.length() > 0) {\n                    val agents = buildList {\n                        for (i in 0 until tasks.length()) {\n                            tasks.optJSONObject(i)?.optString("agent")?.takeIf { it.isNotBlank() }?.let(::add)\n                        }\n                    }.distinct()\n                    if (tasks.length() == 1) agents.firstOrNull().orEmpty() else "${tasks.length()} tasks${if (agents.isNotEmpty()) " · ${agents.joinToString(", ")}" else ""}"\n                } else {\n                    args.optString("agent")\n                }\n            }\n            else -> args.toString().replace('\\n', ' ').let { if (it.length > 800) it.take(800) + " …" else it }\n        }\n    }\n\n    private fun compactToolNumber'''
          text, n = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'PiBridge toolArgsText replacement count={n}')
          bridge_kt.write_text(text)

          text = bridge_js.read_text()
          pattern = r'''function toolArgumentsText\(name, args\) \{.*?\n\}\n\nfunction entryTimestampMs'''
          replacement = '''function toolArgumentsText(name, args) {\n  if (!args || typeof args !== "object") return "";\n  const toolPath = String(args.file_path || args.path || "");\n  if (name === "bash") {\n    const command = String(args.command || "");\n    const timeout = Number(args.timeout || 0);\n    return command + (timeout > 0 ? ` (timeout ${timeout}s)` : "");\n  }\n  if (name === "read") {\n    const offset = Number(args.offset || 0);\n    const limit = Number(args.limit || 0);\n    const range = [offset > 0 ? `offset ${offset}` : "", limit > 0 ? `limit ${limit}` : ""].filter(Boolean).join(", ");\n    return toolPath + (range ? ` [${range}]` : "");\n  }\n  if (name === "write" || name === "edit") return toolPath;\n  if (name === "grep") {\n    const pattern = String(args.pattern || "");\n    return `/${pattern}/` + (toolPath ? ` in ${toolPath}` : "");\n  }\n  if (name === "find") {\n    const pattern = String(args.pattern || args.query || "");\n    return pattern + (toolPath ? ` in ${toolPath}` : "");\n  }\n  if (name === "ls") return toolPath || ".";\n  if (name === "subagent") {\n    const tasks = Array.isArray(args.tasks) ? args.tasks : [];\n    if (tasks.length === 1) return String(tasks[0]?.agent || "");\n    if (tasks.length > 1) return `${tasks.length} tasks`;\n    return String(args.agent || "");\n  }\n  const formatted = JSON.stringify(args);\n  return formatted.length > 800 ? `${formatted.slice(0, 800)} …` : formatted;\n}\n\nfunction entryTimestampMs'''
          text, n = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'bridge toolArgumentsText replacement count={n}')
          text = text.replace(
              '`执行工具：${name}${details ? `\\n\\n${details}` : ""}`',
              '`${name}${details ? ` ${details}` : ""}`',
              1,
          )
          old_result = '''function toolResultText(name, message) {\n  const isError = Boolean(message?.isError);\n  const sections = [isError ? `工具执行失败：${name}` : `工具完成：${name}`];\n  const output = toolResultOutput(name, message);\n  if (output.trim()) sections.push(output);\n  return sections.join("\\n\\n");\n}\n'''
          new_result = '''function toolResultText(_name, message) {\n  const output = toolResultOutput(_name, message);\n  if (output.trim()) return output;\n  return message?.isError ? "Error" : "";\n}\n'''
          if text.count(old_result) != 1:
              raise SystemExit(f'toolResultText anchor count={text.count(old_result)}')
          text = text.replace(old_result, new_result, 1)
          bridge_js.write_text(text)

          text = build.read_text()
          if 'versionCode = 121' not in text or 'versionName = "5.19.21"' not in text:
              raise SystemExit('unexpected version before native tool render repair')
          text = text.replace('versionCode = 121', 'versionCode = 122', 1)
          text = text.replace('versionName = "5.19.21"', 'versionName = "5.19.22"', 1)
          text = text.replace(
              '// v5.19.20 hotfix build 120: deterministic bottom-follow state plus measured-layout watcher.',
              '// v5.19.22 build 122: match native Pi tool call layout and remove Android-only Chinese labels.',
              1,
          )
          build.write_text(text)

          text = test.read_text()
          text += '''\nassert.ok(main.includes('append("$")'), "bash tool cards must render native Pi '$ command' headers");\nassert.ok(!main.includes('Text(if (name == "bash") "$ bash" else name'), "Android must not invent a '$ bash' title");\nassert.ok(!bridge.includes('命令：'), "durable tool history must not inject Chinese command labels");\nassert.ok(!bridge.includes('目标：'), "durable tool history must not inject Chinese target labels");\nassert.ok(bridge.includes('if (name === "write" || name === "edit") return toolPath'), "durable history must keep native compact file-tool headers");\n'''
          test.write_text(text)
          PY
      - name: Verify repair
        run: |
          git diff --check
          node --check app/src/main/assets/pi-android-bridge.mjs
          node tools/test_active_session_ui.mjs
          grep -q 'versionCode = 122' app/build.gradle.kts
          grep -q 'versionName = "5.19.22"' app/build.gradle.kts
          ! grep -q '命令：' app/src/main/assets/pi-android-bridge.mjs
          ! grep -q '目标：' app/src/main/assets/pi-android-bridge.mjs
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/piandroid/MainActivity.kt app/src/main/java/com/piandroid/PiBridge.kt app/src/main/assets/pi-android-bridge.mjs app/build.gradle.kts tools/test_active_session_ui.mjs
          git commit -m "Match native Pi tool rendering"
          git push origin HEAD:fix/security-lifecycle-build
