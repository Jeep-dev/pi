name: Apply deterministic bottom-follow hotfix

on:
  push:
    branches:
      - fix/security-lifecycle-build
    paths:
      - ".github/workflows/fix-bottom-follow.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-lifecycle-build
      - name: Patch bottom-follow state machine
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path('app/src/main/java/com/piandroid/MainActivity.kt')
          build_path = Path('app/build.gradle.kts')
          test_path = Path('tools/test_active_session_ui.mjs')
          main = main_path.read_text()

          start_marker = '    val userScrollLock = remember(listState) {'
          end_marker = '    LazyColumn(state = listState'
          start = main.find(start_marker)
          end = main.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('could not locate ChatPanel scroll lock')

          new_scroll_lock = '''    val userScrollLock = remember(listState) {
              object : NestedScrollConnection {
                  override fun onPreScroll(available: Offset, source: NestedScrollSource): Offset {
                      // Merely touching/dragging at the bottom must not disable follow.
                      // Persistent follow state changes only after real list movement.
                      return Offset.Zero
                  }

                  override fun onPostScroll(consumed: Offset, available: Offset, source: NestedScrollSource): Offset {
                      val verticalMovement = abs(consumed.y) > abs(consumed.x) && abs(consumed.y) > 0.5f
                      val userActuallyMoved = source == NestedScrollSource.UserInput && verticalMovement
                      if (userActuallyMoved) {
                          onUserScrollActivity()
                          onFollowChange(isAtBottom())
                      }
                      return Offset.Zero
                  }
              }
          }
          LaunchedEffect(listState) {
              snapshotFlow { isAtBottom() }
                  .distinctUntilChanged()
                  .collect { atBottom -> if (atBottom) onFollowChange(true) }
          }
          '''
          main = main[:start] + new_scroll_lock + main[end:]

          watcher_marker = '    LaunchedEffect(imeBottom) {'
          watcher_pos = main.find(watcher_marker)
          if watcher_pos < 0:
              raise SystemExit('could not locate IME follow effect')

          watcher = '''    // Observe measured LazyColumn geometry as well as message data. Tool cards,
          // Markdown and web-search output may grow after the ChatLine mutation has already
          // been processed. Any late remeasure that opens space below is followed again.
          // While the user is physically scrolling, this watcher stays idle.
          LaunchedEffect(chatListState) {
              snapshotFlow {
                  val layout = chatListState.layoutInfo
                  val last = layout.visibleItemsInfo.lastOrNull()
                  listOf(
                      layout.totalItemsCount,
                      layout.viewportEndOffset,
                      last?.index ?: -1,
                      last?.offset ?: 0,
                      last?.size ?: 0,
                      if (chatListState.canScrollForward) 1 else 0,
                      if (chatListState.isScrollInProgress) 1 else 0,
                      if (followOutput) 1 else 0
                  )
              }
                  .distinctUntilChanged()
                  .conflate()
                  .collect {
                      if (
                          followOutput &&
                          lines.isNotEmpty() &&
                          chatListState.canScrollForward &&
                          !chatListState.isScrollInProgress
                      ) {
                          chatListState.scrollToRealBottom { followOutput }
                      }
                  }
          }

          '''
          if 'Observe measured LazyColumn geometry as well as message data' not in main:
              main = main[:watcher_pos] + watcher + main[watcher_pos:]

          changelog_line = '                |• 工具卡片底栏：左侧折叠行数 · 中间 Show all / Collapse · 右侧执行时间\n'
          if changelog_line in main and '自动跟随只在用户实际滚离底部后关闭' not in main:
              main = main.replace(
                  changelog_line,
                  '                |• 自动跟随只在用户实际滚离底部后关闭；底部触摸/无效拖动不再误关 follow\n'
                  '                |• 监听 LazyColumn 实际布局变化，web search / Markdown / 工具卡延迟变高也会重新贴底\n'
                  + changelog_line,
                  1,
              )
          main_path.write_text(main)

          build = build_path.read_text()
          if 'versionCode = 119' in build:
              build = build.replace('versionCode = 119', 'versionCode = 120', 1)
          elif 'versionCode = 120' not in build:
              raise SystemExit('unexpected versionCode')
          build = build.replace(
              '// v5.19.20: make bottom-follow resilient to delayed Compose remeasurement.',
              '// v5.19.20 hotfix (120): deterministic bottom-follow state and layout watcher.',
              1,
          )
          build_path.write_text(build)

          test = test_path.read_text()
          old = 'assert.ok(main.includes("abs(available.y) > abs(available.x)"), "horizontal table/code scrolling must not disable bottom follow");'
          new = '''assert.ok(main.includes("val verticalMovement = abs(consumed.y) > abs(consumed.x)"), "only real vertical list movement may change bottom follow");
          assert.ok(main.includes("val userActuallyMoved = source == NestedScrollSource.UserInput && verticalMovement"), "bottom follow must ignore non-user/programmatic scrolling");
          assert.ok(main.includes("Observe measured LazyColumn geometry as well as message data"), "late tool/Markdown layout growth must retrigger bottom follow");'''
          if old in test:
              test = test.replace(old, new, 1)
          elif 'late tool/Markdown layout growth must retrigger bottom follow' not in test:
              raise SystemExit('could not update bottom-follow test guard')
          test_path.write_text(test)
          PY
      - name: Verify patch
        run: |
          git diff --check
          grep -q 'val userActuallyMoved = source == NestedScrollSource.UserInput && verticalMovement' app/src/main/java/com/piandroid/MainActivity.kt
          grep -q 'Observe measured LazyColumn geometry as well as message data' app/src/main/java/com/piandroid/MainActivity.kt
          grep -q 'chatListState.isScrollInProgress' app/src/main/java/com/piandroid/MainActivity.kt
          grep -q 'versionCode = 120' app/build.gradle.kts
          node tools/test_active_session_ui.mjs
      - name: Commit hotfix
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/piandroid/MainActivity.kt app/build.gradle.kts tools/test_active_session_ui.mjs
          git commit -m "Make bottom follow deterministic across delayed tool reflow"
          git push origin HEAD:fix/security-lifecycle-build
