name: Apply deterministic bottom-follow hotfix

on:
  push:
    branches:
      - fix/security-lifecycle-build
    paths:
      - ".github/workflows/fix-bottom-follow.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-lifecycle-build
      - name: Patch bottom-follow state machine
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          main_path = root / 'app/src/main/java/com/piandroid/MainActivity.kt'
          build_path = root / 'app/build.gradle.kts'
          main = main_path.read_text()

          old_scroll_lock = '''    val userScrollLock = remember(listState) {
              object : NestedScrollConnection {
                  override fun onPreScroll(available: Offset, source: NestedScrollSource): Offset {
                      val verticalInput = abs(available.y) > abs(available.x) && abs(available.y) > 0.5f
                      if (source == NestedScrollSource.UserInput && verticalInput) {
                          onFollowChange(false)
                          onUserScrollActivity()
                      }
                      return Offset.Zero
                  }

                  override fun onPostScroll(consumed: Offset, available: Offset, source: NestedScrollSource): Offset {
                      val verticalInput = abs(consumed.y) > abs(consumed.x) || abs(available.y) > abs(available.x)
                      if (source == NestedScrollSource.UserInput && verticalInput && isAtBottom()) onFollowChange(true)
                      return Offset.Zero
                  }
              }
          }
          LaunchedEffect(listState) { snapshotFlow { isAtBottom() }.distinctUntilChanged().collect { atBottom -> if (atBottom) onFollowChange(true) } }
          '''

          new_scroll_lock = '''    val userScrollLock = remember(listState) {
              object : NestedScrollConnection {
                  override fun onPreScroll(available: Offset, source: NestedScrollSource): Offset {
                      // Do not disable follow merely because a finger touched/dragged vertically.
                      // Persistently leave follow mode only after the list actually moved away
                      // from the bottom. This avoids a race where new tool/search content grows
                      // between pre-scroll and post-scroll and falsely latches follow=false.
                      return Offset.Zero
                  }

                  override fun onPostScroll(consumed: Offset, available: Offset, source: NestedScrollSource): Offset {
                      val userActuallyMoved = source == NestedScrollSource.UserInput && abs(consumed.y) > 0.5f
                      if (userActuallyMoved) {
                          onUserScrollActivity()
                          onFollowChange(isAtBottom())
                      }
                      return Offset.Zero
                  }
              }
          }
          LaunchedEffect(listState) {
              snapshotFlow { isAtBottom() }
                  .distinctUntilChanged()
                  .collect { atBottom -> if (atBottom) onFollowChange(true) }
          }
          '''

          if old_scroll_lock not in main:
              raise SystemExit('user scroll lock block did not match current source')
          main = main.replace(old_scroll_lock, new_scroll_lock, 1)

          marker = '''    LaunchedEffect(imeBottom) {
              if (imeBottom > 0 && followOutput && lines.isNotEmpty()) {
                  delay(80)
                  chatListState.scrollToRealBottom { followOutput }
              }
          }
          '''

          layout_watcher = '''    // Follow the measured LazyColumn layout itself, not only message data mutations.
          // Tool cards, Markdown and web-search results can become taller a frame (or several
          // frames) after the backing ChatLine changed. If that late remeasure opens scrollable
          // space while follow=true, immediately catch up to the real bottom. While the user is
          // physically scrolling, this watcher stays out of the way.
          LaunchedEffect(chatListState) {
              snapshotFlow {
                  val layout = chatListState.layoutInfo
                  val last = layout.visibleItemsInfo.lastOrNull()
                  listOf(
                      layout.totalItemsCount,
                      layout.viewportEndOffset,
                      last?.index ?: -1,
                      last?.offset ?: 0,
                      last?.size ?: 0,
                      if (chatListState.canScrollForward) 1 else 0,
                      if (chatListState.isScrollInProgress) 1 else 0,
                      if (followOutput) 1 else 0
                  )
              }
                  .distinctUntilChanged()
                  .conflate()
                  .collect {
                      if (
                          followOutput &&
                          lines.isNotEmpty() &&
                          chatListState.canScrollForward &&
                          !chatListState.isScrollInProgress
                      ) {
                          chatListState.scrollToRealBottom { followOutput }
                      }
                  }
          }

          ''' + marker

          if marker not in main:
              raise SystemExit('IME follow marker did not match current source')
          main = main.replace(marker, layout_watcher, 1)

          changelog_marker = '''                |• 工具卡片底栏：左侧折叠行数 · 中间 Show all / Collapse · 右侧执行时间
          '''
          changelog_new = '''                |• 自动跟随只在用户实际滚离底部后关闭；底部触摸/无效拖动不再误关 follow
                  |• 直接监听 LazyColumn 实际布局变化，web search / Markdown / 工具卡延迟变高也会重新贴底
                  |• 工具卡片底栏：左侧折叠行数 · 中间 Show all / Collapse · 右侧执行时间
          '''
          if changelog_marker not in main:
              raise SystemExit('changelog marker did not match current source')
          main = main.replace(changelog_marker, changelog_new, 1)
          main_path.write_text(main)

          build = build_path.read_text()
          if 'versionCode = 119' not in build:
              raise SystemExit('expected versionCode 119')
          build = build.replace('versionCode = 119', 'versionCode = 120', 1)
          build = build.replace('// v5.19.20: make bottom-follow resilient to delayed Compose remeasurement.', '// v5.19.20 hotfix (120): deterministic bottom-follow state and layout watcher.', 1)
          build_path.write_text(build)
          PY
      - name: Verify patch
        run: |
          git diff --check
          grep -q 'val userActuallyMoved = source == NestedScrollSource.UserInput' app/src/main/java/com/piandroid/MainActivity.kt
          grep -q 'Follow the measured LazyColumn layout itself' app/src/main/java/com/piandroid/MainActivity.kt
          grep -q 'chatListState.isScrollInProgress' app/src/main/java/com/piandroid/MainActivity.kt
          grep -q 'versionCode = 120' app/build.gradle.kts
          node tools/test_active_session_ui.mjs
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/piandroid/MainActivity.kt app/build.gradle.kts
          git commit -m "Make bottom follow deterministic across delayed tool reflow"
          git push origin HEAD:fix/security-lifecycle-build
