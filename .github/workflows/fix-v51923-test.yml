name: Fix v5.19.23 bridge test

on:
  push:
    branches:
      - fix/security-lifecycle-build
    paths:
      - ".github/workflows/fix-v51923-test.yml"

permissions:
  contents: write

jobs:
  fix-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-lifecycle-build
      - name: Update bridge test expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/test_bridge_auth.mjs')
          s = p.read_text()
          old = 'assert.equal(health.bridgeVersion, "2026-09-13.1");'
          new = 'assert.equal(health.bridgeVersion, "2026-09-14.1");'
          if old not in s:
              raise SystemExit('old bridge version assertion not found')
          s = s.replace(old, new, 1)
          cap = 'assert.ok(health.capabilities.includes("tool-history-metadata-v1"));'
          add = cap + '\n  assert.ok(health.capabilities.includes("tool-args-lossless-v1"));'
          if 'tool-args-lossless-v1' not in s:
              if cap not in s:
                  raise SystemExit('capability anchor not found')
              s = s.replace(cap, add, 1)
          p.write_text(s)
          PY
          node --check tools/test_bridge_auth.mjs
          git diff --check
      - name: Commit test fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/test_bridge_auth.mjs
          git commit -m "Update bridge test for v5.19.23"
          git push origin HEAD:fix/security-lifecycle-build
