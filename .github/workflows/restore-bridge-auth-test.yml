name: Restore bridge auth test

on:
  push:
    branches:
      - fix/security-lifecycle-build
    paths:
      - ".github/workflows/restore-bridge-auth-test.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-lifecycle-build
          fetch-depth: 0
      - name: Restore original test and update bridge contract
        run: |
          git show 3a8663e01013387d6e7cb51d99c98d42638fec27:tools/test_bridge_auth.mjs > tools/test_bridge_auth.mjs
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/test_bridge_auth.mjs')
          s = p.read_text()
          old = 'assert.equal(health.bridgeVersion, "2026-09-12.3");'
          if s.count(old) != 1:
              raise SystemExit('bridge version assertion not found exactly once')
          s = s.replace(old, 'assert.equal(health.bridgeVersion, "2026-09-13.1");', 1)
          marker = '  assert.ok(health.capabilities.includes("conversation-owner-v1"));\n'
          if s.count(marker) != 1:
              raise SystemExit('capability assertion marker not found exactly once')
          s = s.replace(marker, marker + '  assert.ok(health.capabilities.includes("tool-history-metadata-v1"));\n', 1)
          p.write_text(s)
          PY
          node --check tools/test_bridge_auth.mjs
          git diff --check
      - name: Commit restored test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/test_bridge_auth.mjs
          git commit -m "Restore bridge auth coverage for tool history metadata [skip ci]"
          git push origin HEAD:fix/security-lifecycle-build
