name: Build Pi Android
on:
  workflow_dispatch:
  push:
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", "gradle/**", ".github/workflows/android.yml"]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: chmod +x ./gradlew && ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: pi-android-debug, path: app/build/outputs/apk/debug/*.apk }
