name: Build Pi Android
on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "tools/test_bridge_auth.mjs"
      - "tools/test_mobile_tree.mjs"
      - "tools/test_mobile_fork.mjs"
      - "tools/test_mobile_resources.mjs"
      - "tools/test_multi_session_bridge.mjs"
      - "tools/test_themes.mjs"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - "tools/test_bridge_auth.mjs"
      - "tools/test_mobile_tree.mjs"
      - "tools/test_mobile_fork.mjs"
      - "tools/test_mobile_resources.mjs"
      - "tools/test_multi_session_bridge.mjs"
      - "tools/test_themes.mjs"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pi-android.jks"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate bridge, mobile extension, and UI guards
        run: |
          npm install --global --ignore-scripts @earendil-works/pi-coding-agent@0.85.1
          node --check app/src/main/assets/pi-android-bridge.mjs
          node tools/test_bridge_auth.mjs
          node tools/test_multi_session_bridge.mjs
          node tools/test_themes.mjs
          PI_BIN="$(npm root --global)/@earendil-works/pi-coding-agent/dist/bundle/cli.js" node tools/test_mobile_tree.mjs
          PI_BIN="$(npm root --global)/@earendil-works/pi-coding-agent/dist/bundle/cli.js" node tools/test_mobile_fork.mjs
          PI_BIN="$(npm root --global)/@earendil-works/pi-coding-agent/dist/bundle/cli.js" node tools/test_mobile_resources.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build signed debug and release APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pi-android.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x ./gradlew && ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pi-android-v5.18.0-apks
          path: app/build/outputs/apk/**/*.apk
