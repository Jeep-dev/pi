name: Build Pi Android
on:
  workflow_dispatch:
  push:
    paths: ["app/**", "tools/build_patch_v44.py", "tools/build_patch_v45.py", "tools/build_patch_v46.py", "build.gradle.kts", "settings.gradle.kts", "gradle/**", ".github/workflows/android.yml"]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply PiTouch v4.4 startup isolation patch
        run: python3 tools/build_patch_v44.py
      - name: Apply PiTouch v4.5 direct resume patch
        run: python3 tools/build_patch_v45.py
      - name: Apply PiTouch v4.6 command scroll and reasoning effort patch
        run: python3 tools/build_patch_v46.py
      - name: Validate Pi bridge JavaScript
        run: node --check app/src/main/assets/pi-android-bridge.mjs
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: chmod +x ./gradlew && ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: pi-android-v4.6-debug, path: app/build/outputs/apk/debug/*.apk }
