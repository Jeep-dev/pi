name: Build Pi Android
on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "tools/test_bridge_auth.mjs"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - "tools/test_bridge_auth.mjs"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate and test authenticated bridge
        run: |
          node --check app/src/main/assets/pi-android-bridge.mjs
          node tools/test_bridge_auth.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug and release APKs
        run: chmod +x ./gradlew && ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pi-android-v5.6-apks
          path: app/build/outputs/apk/**/*.apk
